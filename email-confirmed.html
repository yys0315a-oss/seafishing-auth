<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>바다낚시 이메일 인증 완료</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #eef7f7;
      color: #222;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }
    main {
      width: min(100%, 520px);
      padding: 40px 28px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 36px rgba(22, 114, 122, .12);
      text-align: center;
    }
    h1 { margin: 0 0 16px; color: #16727a; font-size: 26px; }
    p { margin: 0; line-height: 1.8; }
  </style>
</head>
<body>
  <main>
    <h1>이메일 인증이 완료되었습니다.</h1>
    <p>이제 게임으로 돌아가 로그인해 주세요.</p>
  </main>
</body>
</html>
